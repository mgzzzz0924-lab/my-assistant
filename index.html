<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>MY ASSISTANT</title>
  <meta name="theme-color" content="#8878cc" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="MY ASSISTANT" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="icon" type="image/svg+xml" href="icon.svg" />
  <link rel="manifest" href="manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
:root{--bg:#f0eef8;--s1:#ffffff;--s2:#f7f5fd;--bd:#e2ddf8;--lav:#8878cc;--lav-soft:#b8b0e8;--lav-pale:#edeafc;--lav-xs:#f5f3ff;--t1:#24223a;--t2:#8c8aac;--t3:#c4c2d8;--red:#f3b5be;--ora:#f5cfae;--ylw:#ecd9a3;--grn:#b6dec6;--blu:#b8d2ee;--pur:#d4c2ee;--shadow:0 2px 16px rgba(80,60,160,.08);--shadow-sm:0 1px 6px rgba(80,60,160,.06)}
body.dark{--bg:#1a1826;--s1:#232130;--s2:#2c293e;--bd:#3d3a58;--lav:#a898e8;--lav-soft:#8878cc;--lav-pale:#2e2b50;--lav-xs:#252340;--t1:#e8e6f8;--t2:#9090b8;--t3:#5a587a;--red:#c47880;--ora:#c4a070;--ylw:#bba060;--grn:#72a884;--blu:#7098c0;--pur:#9880c8;--shadow:0 2px 20px rgba(0,0,0,.4);--shadow-sm:0 1px 8px rgba(0,0,0,.3)}
*{margin:0;padding:0;box-sizing:border-box;transition:background-color .25s,border-color .25s,color .15s}
body{background:var(--bg);color:var(--t1);font-family:'Nunito','Segoe UI',sans-serif;min-height:100vh;font-size:14px}
.hdr{padding:16px 16px 8px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.hdr-t{font-family:'Space Mono',monospace;font-size:15px;color:var(--lav);letter-spacing:1px;font-weight:700}
.hdr-right{display:flex;align-items:center;gap:8px}
.icon-btn{background:var(--s1);border:none;border-radius:10px;padding:7px 10px;cursor:pointer;font-size:14px;color:var(--t2);box-shadow:var(--shadow-sm);transition:.15s}
.icon-btn:hover{background:var(--lav-pale);color:var(--lav)}
.login-badge{display:flex;align-items:center;gap:6px;background:var(--lav-pale);border-radius:10px;padding:6px 10px;font-size:11px;color:var(--lav);font-weight:600;cursor:pointer;border:none}
.login-badge img{width:18px;height:18px;border-radius:50%}
.sync-toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--lav);color:#fff;padding:10px 22px;border-radius:20px;font-size:13px;font-weight:600;z-index:9999;box-shadow:0 4px 16px rgba(80,60,160,.3);opacity:0;transition:opacity .3s;pointer-events:none}
.sync-toast.show{opacity:1}
.tnav{display:flex;padding:10px 16px 0}
.tnav button{flex:1;padding:12px 4px 10px;background:none;border:none;border-bottom:2px solid transparent;color:var(--t3);font-size:11px;cursor:pointer;transition:.2s;font-family:'Space Mono',monospace;letter-spacing:.5px}
.tnav button.active{color:var(--lav);border-bottom-color:var(--lav)}
.page{padding:14px 16px 60px;max-width:680px;margin:0 auto}
.card{background:var(--s1);border-radius:20px;padding:18px;margin-bottom:12px;box-shadow:var(--shadow)}
.lbl{font-size:13px;color:var(--t1);letter-spacing:-.01em;margin-bottom:14px;font-family:'Nunito','Segoe UI',sans-serif;font-weight:700;display:flex;align-items:center;gap:6px}
.app input,.app select{background:var(--s2);border:none;border-radius:12px;padding:10px 14px;color:var(--t1);font-size:14px;outline:none;font-family:inherit;transition:.2s;width:100%}
.app input:focus,.app select:focus{background:var(--lav-pale);box-shadow:0 0 0 2px var(--lav-soft)}
.app input::placeholder{color:var(--t3)}
.btn{background:var(--lav);border:none;border-radius:12px;padding:10px 18px;color:#fff;font-size:13px;font-weight:600;cursor:pointer;transition:.15s;white-space:nowrap;font-family:inherit}
.btn:hover{background:#7060bc}
.btn-g{background:var(--lav-pale);color:var(--lav);font-weight:500}
.btn-g:hover,.btn-g.on{background:var(--lav);color:#fff}
.btn-sm{font-size:12px;padding:7px 13px;border-radius:10px}
.btn-icon{background:none;border:none;cursor:pointer;padding:3px 5px;font-size:14px;line-height:1;color:var(--t2)}
.btn-icon:hover{color:var(--lav)}
.row{display:flex;gap:8px;align-items:center}
.empty{text-align:center;color:var(--t3);padding:28px;font-size:13px;line-height:1.8}
.sub-tabs{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.sub-tabs::-webkit-scrollbar{display:none}
.sub-tab{padding:7px 16px;background:var(--s1);border:none;border-radius:20px;color:var(--t2);font-size:12px;cursor:pointer;text-align:center;transition:.2s;white-space:nowrap;box-shadow:var(--shadow-sm);font-weight:500;font-family:inherit}
.sub-tab.on{background:var(--lav);color:#fff;box-shadow:0 4px 12px rgba(136,120,204,.3)}
.add-row{display:flex;gap:8px;margin-bottom:10px}
.add-row input{flex:1}
.frow{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
.frow .btn-sm{border-radius:20px}
.pri-dot{width:14px;height:14px;border-radius:50%;display:inline-block;flex-shrink:0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.04)}
.pri-picker{position:relative}
.pri-trigger{display:inline-flex;align-items:center;gap:6px;padding:7px 11px;background:var(--lav-pale);border:none;border-radius:20px;cursor:pointer;font-size:12px;color:var(--lav);font-weight:500;font-family:inherit;transition:.15s}
.pri-trigger:hover,.pri-trigger.on{background:var(--lav);color:#fff}
.pri-trigger .caret{font-size:9px;opacity:.8}
.pri-menu{position:absolute;top:calc(100% + 6px);left:0;background:#fff;border-radius:14px;padding:8px;box-shadow:0 8px 24px rgba(80,60,160,.16);display:flex;flex-direction:column;gap:4px;z-index:20;min-width:110px}
.pri-menu .pri-opt{width:100%;height:32px;border-radius:10px;border:2px solid transparent;display:flex;align-items:center;gap:8px;cursor:pointer;transition:.15s;background:transparent;padding:0 8px;font-size:12px;font-family:inherit;color:var(--t1);font-weight:500}
.pri-menu .pri-opt:hover{background:var(--lav-xs)}
.pri-menu .pri-opt.sel{border-color:var(--lav)}
.ti{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--s2);border-radius:14px;margin-bottom:7px;border-left:4px solid transparent}
.ti.pr{border-left:4px solid var(--red);background:color-mix(in srgb,var(--red) 12%,var(--s2))}
.ti.po{border-left:4px solid var(--ora);background:color-mix(in srgb,var(--ora) 12%,var(--s2))}
.ti.py{border-left:4px solid var(--ylw);background:color-mix(in srgb,var(--ylw) 12%,var(--s2))}
.ti.pg{border-left:4px solid var(--grn);background:color-mix(in srgb,var(--grn) 12%,var(--s2))}
.ti.pb{border-left:4px solid var(--blu);background:color-mix(in srgb,var(--blu) 12%,var(--s2))}
.ti.pp{border-left:4px solid var(--pur);background:color-mix(in srgb,var(--pur) 12%,var(--s2))}
.ti.dn .tt{text-decoration:line-through;color:var(--t3)}
.ti-edit{display:flex;gap:6px;flex:1;align-items:center}
.ti-edit input{flex:1;padding:6px 10px;font-size:13px}
.chk{width:20px;height:20px;border-radius:6px;border:2px solid var(--t3);flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:11px;transition:.15s}
.chk.on{background:var(--lav);border-color:var(--lav);color:#fff}
.tt{flex:1;font-size:14px}
.prog-card{transition:background .6s ease,box-shadow .6s ease}
.prog-info{display:flex;justify-content:space-between;font-size:12px;color:var(--t2);margin-bottom:7px;font-weight:500}
.pbar{background:var(--lav-pale);border-radius:6px;height:6px;overflow:hidden}
.pfill{height:100%;background:linear-gradient(90deg,var(--lav),var(--lav-soft));border-radius:6px;transition:.4s}
@keyframes pctBounce{0%{transform:scale(1)}40%{transform:scale(1.35)}70%{transform:scale(.92)}100%{transform:scale(1)}}
.pct-bounce{animation:pctBounce .4s ease forwards}
.pPct{font-weight:700;font-size:13px;transition:color .4s;display:inline-block}
.goals-box{background:var(--lav-xs);border-radius:16px;padding:14px;margin-bottom:14px}
.goals-box .lbl{color:var(--lav)}
.goal-item{display:flex;align-items:center;gap:9px;padding:9px 12px;background:#fff;border-radius:12px;margin-bottom:6px;box-shadow:var(--shadow-sm)}
.goal-txt{flex:1;font-size:13px}
.goal-chk{width:16px;height:16px;border-radius:50%;border:2px solid var(--t3);flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:9px;transition:.15s}
.goal-chk.on{background:var(--lav);border-color:var(--lav);color:#fff}
.goal-item.done .goal-txt{text-decoration:line-through;color:var(--t3)}
.goal-add{display:flex;gap:7px;margin-top:8px}
.goal-add input{flex:1;background:#fff}
.week-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.wnb{background:var(--lav-pale);border:none;color:var(--lav);border-radius:10px;padding:6px 13px;cursor:pointer;font-size:16px;font-weight:600}
.wnb:hover{background:var(--lav);color:#fff}
.week-title{font-family:'Space Mono',monospace;font-size:12px;color:var(--t2)}
.day-col{background:var(--s2);border-radius:16px;padding:12px;margin-bottom:8px}
.day-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}
.day-name{font-size:13px;font-weight:600}
.day-name.td{color:var(--lav)}
.day-date-lbl{font-size:11px;color:var(--t3)}
.day-ev{display:flex;align-items:center;gap:7px;padding:7px 10px;background:#fff;border-radius:10px;margin-bottom:4px;box-shadow:var(--shadow-sm)}
.day-ev .chk{width:16px;height:16px}
.day-ev-edit{display:flex;gap:5px;flex:1}
.day-ev-edit input{flex:1;padding:5px 9px;font-size:13px}
.ev-type-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.day-add-row{display:flex;gap:6px;margin-top:8px}
.day-add-row input{flex:1;font-size:13px;padding:8px 12px;background:#fff}
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.cnb{background:var(--lav-pale);border:none;color:var(--lav);border-radius:10px;padding:6px 13px;cursor:pointer;font-size:16px;font-weight:600}
.cnb:hover{background:var(--lav);color:#fff}
.cal-title{font-size:15px;font-weight:600}
.cal-grid{display:grid;grid-template-columns:22px repeat(7,1fr);border:1px solid var(--bd);border-radius:14px;overflow:hidden}
.ch{text-align:center;font-size:11px;color:var(--t2);padding:10px 0;font-weight:700;background:var(--s2);border-right:1px solid var(--bd);border-bottom:1px solid var(--bd)}
.ch:last-child{border-right:none}
.cd{min-height:58px;display:flex;flex-direction:column;justify-content:space-between;padding:6px 7px;font-size:13px;position:relative;transition:.15s;background:var(--s1);cursor:pointer;border-right:1px solid var(--bd);border-bottom:1px solid var(--bd)}
.cd:nth-child(8n){border-right:none}
.cd:hover{background:var(--lav-xs)}
.cd.other{background:var(--s2)}
.cd.sel{background:var(--lav-pale)}
.cd-num{align-self:flex-end;font-size:13px;font-weight:500;color:var(--t1);width:22px;height:22px;display:flex;align-items:center;justify-content:center;border-radius:50%}
.cd.other .cd-num{color:var(--t3)}
.cd.sel .cd-num{color:var(--lav);font-weight:700}
.cd-num.today-num{background:var(--lav);color:#fff;font-weight:700}
.cd-dots{display:flex;gap:3px;align-self:flex-start;min-height:5px}
.edot{width:5px;height:5px;border-radius:50%}
.edot.timed{background:var(--lav)}
.edot.allday{background:var(--blu)}
.edot.habit{background:var(--pur)}.edot.gcal{background:#1a73e8}
.gcal-banner{background:var(--lav-xs);border-radius:14px;padding:12px 16px;margin-bottom:14px;display:flex;align-items:center;gap:10px}
.gcal-badge{font-size:9px;padding:1px 5px;border-radius:20px;background:#e8f0fe;color:#1a73e8;font-weight:700;flex-shrink:0}
.cd.p1{box-shadow:inset 0 0 0 3px #d8d0ff}
.cd.p2{box-shadow:inset 0 0 0 3px #c0b0f0}
.cd.p3{box-shadow:inset 0 0 0 3px #a090e0}
.cd.p4{box-shadow:inset 0 0 0 4px #8878cc}
.cd.p5{box-shadow:inset 0 0 0 4px #6858aa,inset 0 0 14px rgba(120,100,200,.25);background:#faf8ff}
.ev-panel{margin-top:14px;border-top:1px solid var(--lav-pale);padding-top:14px}
.ev-hdr{font-size:13px;color:var(--lav);font-weight:600;margin-bottom:12px}
.ev-form{background:var(--s2);border-radius:14px;padding:14px;margin-bottom:12px}
.ev-form-row{display:flex;gap:7px;margin-bottom:8px;align-items:center}
.ev-form-row input{flex:1;background:#fff}
.allday-toggle{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--t2);cursor:pointer;margin-bottom:9px}
.allday-toggle input[type=checkbox]{width:16px;height:16px;accent-color:var(--lav);cursor:pointer;flex-shrink:0}
.allday-tag{font-size:10px;padding:3px 9px;border-radius:20px;background:var(--lav-pale);color:var(--lav);font-weight:600}
.ev-item{display:flex;align-items:center;gap:9px;padding:10px 13px;background:var(--s2);border-radius:12px;margin-bottom:6px}
.ev-time{font-family:'Space Mono',monospace;font-size:11px;color:var(--t2);min-width:38px}
.ev-txt{flex:1;font-size:13px}
.ev-item.done-ev .ev-txt{text-decoration:line-through;color:var(--t3)}
.ev-inline-edit{display:flex;gap:6px;flex:1}
.ev-inline-edit input{flex:1;padding:5px 9px;font-size:13px;background:#fff}
.habit-section-lbl{font-size:10px;color:var(--pur);letter-spacing:1px;margin:12px 0 6px;font-family:'Space Mono',monospace;font-weight:600}
.habit-ev-row{display:flex;align-items:center;gap:7px;padding:7px 11px;background:#f9f4ff;border-radius:10px;margin-bottom:5px}
.habit-card{background:var(--s1);border-radius:18px;padding:16px;margin-bottom:10px;box-shadow:var(--shadow);border-left:4px solid transparent}
.habit-head{display:flex;align-items:center;gap:11px;margin-bottom:12px}
.habit-icon{font-size:22px;width:36px;height:36px;display:flex;align-items:center;justify-content:center;background:var(--lav-pale);border-radius:12px}
.habit-name{flex:1;font-size:15px;font-weight:600}
.habit-streak{font-family:'Space Mono',monospace;font-size:14px;color:var(--lav);font-weight:700}
.habit-streak-lbl{font-size:10px;color:var(--t3)}
.habit-grid{display:flex;gap:5px;margin-bottom:10px}
.hg-day{display:flex;flex-direction:column;align-items:center;gap:4px;flex:1}
.hg-d{font-size:10px;color:var(--t3);font-weight:500}
.hg-dot{width:26px;height:26px;border-radius:8px;background:var(--s2);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:12px;transition:.15s}
.hg-dot.done{background:var(--lav-pale);color:var(--lav)}
.hg-dot.today-dot{box-shadow:0 0 0 2px var(--lav)}
.hg-dot.future{opacity:.25;cursor:default}
.day-pill{font-size:10px;padding:3px 9px;border-radius:20px;background:var(--lav-pale);color:var(--lav);font-weight:600}
.habit-days-row{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
.day-sel{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px}
.day-btn{min-width:36px;height:32px;padding:0 10px;border-radius:20px;background:var(--s2);border:none;color:var(--t2);font-size:12px;cursor:pointer;transition:.15s;font-weight:500;font-family:inherit}
.day-btn.on{background:var(--lav);color:#fff}
.habit-edit-form{background:var(--s2);border-radius:14px;padding:14px;margin-bottom:10px}
.habit-edit-form input{margin-bottom:7px;background:#fff}
.habit-color-row{display:flex;gap:7px;margin-bottom:12px;flex-wrap:wrap}
.hb-col-btn{display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;padding:7px 10px;border-radius:14px;border:2px solid transparent;transition:.15s;background:none;font-family:inherit}
.hb-col-btn:hover{background:var(--lav-xs)}
.hb-col-btn.sel{border-color:var(--t1);background:var(--lav-xs)}
.hb-col-dot{width:30px;height:30px;border-radius:50%;box-shadow:0 2px 6px rgba(0,0,0,.1)}
.hb-col-label{font-size:10px;color:var(--t2);font-weight:700}
.color-picker{display:flex;gap:7px;margin-bottom:10px;flex-wrap:wrap}
.color-dot{width:22px;height:22px;border-radius:50%;cursor:pointer;transition:.15s;border:2px solid transparent}
.color-dot.sel{border-color:var(--t1);transform:scale(1.2)}
.cat-list{display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
.cat-card{background:var(--s1);border-radius:18px;overflow:hidden;box-shadow:var(--shadow)}
.cat-head{display:flex;align-items:center;gap:10px;padding:14px 16px;cursor:pointer;transition:.15s}
.cat-head:hover{background:var(--lav-xs)}
.cat-icon{font-size:20px;width:36px;height:36px;display:flex;align-items:center;justify-content:center;background:var(--lav-pale);border-radius:12px}
.cat-name-txt{flex:1;font-size:14px;font-weight:600}
.cat-summary{font-size:11px;color:var(--t3)}
.cat-arrow{color:var(--t3);font-size:14px;transition:.2s}
.cat-card.open .cat-arrow{transform:rotate(90deg)}
.cat-body{display:none;padding:0 16px 16px;border-top:1px solid var(--lav-xs)}
.cat-card.open .cat-body{display:block}
.step-list{margin:10px 0}
.step-item{display:flex;align-items:center;gap:9px;padding:9px 12px;background:var(--s2);border-radius:12px;margin-bottom:6px}
.step-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.step-nm{flex:1;font-size:13px}
.step-dur{font-family:'Space Mono',monospace;font-size:12px;color:var(--lav);min-width:46px;text-align:right;font-weight:700}
.step-edit-row{display:flex;gap:5px;flex:1;align-items:center;flex-wrap:wrap}
.step-edit-row input{padding:5px 9px;font-size:12px;background:#fff}
.add-step{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap;align-items:center}
.add-step input{flex:1;min-width:70px;background:#fff}
.dur-inp{width:62px!important;flex:none!important}
.edit-form{background:var(--s2);border-radius:14px;padding:13px;margin-bottom:10px}
.edit-form input{margin-bottom:7px;background:#fff}
.back-btn{display:flex;align-items:center;gap:6px;background:none;border:none;color:var(--t2);cursor:pointer;font-size:13px;margin-bottom:14px;padding:0;font-weight:500;font-family:inherit}
.back-btn:hover{color:var(--lav)}
.run-title{font-size:12px;color:var(--t3);margin-bottom:4px;font-weight:500}
.run-sname{font-size:20px;font-weight:600;margin-bottom:16px}
.ring-outer{display:flex;justify-content:center;position:relative;margin-bottom:16px}
.ring-outer svg{transform:rotate(-90deg)}
.ring-center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center}
.ring-time{font-family:'Space Mono',monospace;font-size:42px;font-weight:700;letter-spacing:-2px}
.ring-lbl{font-size:11px;color:var(--t3);margin-top:5px;letter-spacing:.5px}
.pomo-btns{display:flex;justify-content:center;gap:12px;margin-bottom:12px}
.pomo-btns .btn{min-width:120px;font-size:14px;padding:13px 20px}
.rst-btn{background:var(--s2);color:var(--t2)}
.rst-btn:hover{background:var(--lav-pale);color:var(--lav)}
.sp-progress{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;margin-bottom:16px}
.sp-dot{width:12px;height:12px;border-radius:50%;background:var(--lav-pale);border:2px solid var(--lav-pale);cursor:pointer;transition:.2s}
.sp-dot:hover{background:var(--lav-soft);border-color:var(--lav-soft);transform:scale(1.3)}
.sp-dot.d{background:var(--lav);border-color:var(--lav)}
.sp-dot.d:hover{background:#6858aa}
.sp-dot.c{background:var(--lav);border-color:var(--lav);box-shadow:0 0 0 3px var(--lav-pale);transform:scale(1.2)}
.stats-row{display:flex;justify-content:center;gap:48px}
.stat-box{text-align:center;background:var(--s2);border-radius:16px;padding:14px 24px}
.stat-val{font-family:'Space Mono',monospace;font-size:24px;color:var(--lav);font-weight:700}

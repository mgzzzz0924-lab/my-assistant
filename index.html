<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>MY ASSISTANT</title>
  <meta name="theme-color" content="#1A1A1A" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="MY ASSISTANT" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="icon" type="image/svg+xml" href="icon.svg" />
  <link rel="manifest" href="manifest.json" />
  <script src="https://accounts.google.com/gsi/client" async></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.css">
  <style>
:root{--bg:#FFFFFF;--s1:#FFFFFF;--s2:#F7F6F4;--bd:#EEECEA;--lav:#1A1A1A;--lav-soft:#555555;--lav-pale:#F0EFED;--lav-xs:#FAFAF8;--t1:#1A1A1A;--t2:#888888;--t3:#C0BCBA;--red:#EF4444;--ora:#F97316;--ylw:#FFD600;--grn:#22C55E;--blu:#3B82F6;--ind:#6366F1;--pur:#8B5CF6;--shadow:0 1px 8px rgba(0,0,0,.04);--shadow-sm:0 1px 3px rgba(0,0,0,.03)}
body.dark{--bg:#111111;--s1:#1C1C1E;--s2:#252527;--bd:#2C2C2E;--lav:#F0F0F0;--lav-soft:#AAAAAA;--lav-pale:#2C2C2E;--lav-xs:#1C1C1E;--t1:#F0F0F0;--t2:#888888;--t3:#444444;--red:#F87171;--ora:#FB923C;--ylw:#FFE033;--grn:#4ADE80;--blu:#60A5FA;--ind:#818CF8;--pur:#A78BFA;--shadow:0 2px 20px rgba(0,0,0,.5);--shadow-sm:0 1px 8px rgba(0,0,0,.3)}
*{margin:0;padding:0;box-sizing:border-box;transition:background-color .25s,border-color .25s,color .15s}
body{background:var(--bg);color:var(--t1);font-family:'Pretendard','Segoe UI',sans-serif;min-height:100vh;font-size:14px}
.hdr{padding:18px 18px 12px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;background:var(--s1);border-bottom:none}
.hdr-left{display:flex;align-items:flex-start;gap:12px}
.hdr-avatar{width:40px;height:40px;border-radius:10px;background:#1A1A1A;color:#FFFFFF;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;overflow:hidden;cursor:pointer;border:none;flex-shrink:0;padding:0}
.hdr-avatar img{width:100%;height:100%;object-fit:cover;border-radius:inherit}
.hdr-name{font-size:15px;font-weight:700;color:var(--t1);line-height:1.2}
.hdr-date{font-size:12px;color:var(--t2);margin-top:3px;line-height:1.3}
.hdr-right{display:flex;align-items:center;gap:6px}
.icon-btn{background:none;border:1px solid var(--bd);border-radius:10px;padding:8px 10px;cursor:pointer;font-size:14px;color:var(--t2);transition:.15s;line-height:1}
.icon-btn:hover{background:var(--s2);color:var(--t1)}
.login-badge{display:flex;align-items:center;gap:6px;background:var(--s2);border-radius:8px;padding:5px 9px;font-size:11px;color:var(--t1);font-weight:600;cursor:pointer;border:1px solid var(--bd)}
.login-badge img{width:17px;height:17px;border-radius:50%}
.sync-toast{position:fixed;bottom:76px;left:50%;transform:translateX(-50%);background:var(--lav);color:var(--s1);padding:10px 22px;border-radius:20px;font-size:13px;font-weight:600;z-index:9999;box-shadow:0 4px 16px rgba(0,0,0,.2);opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
.sync-toast.show{opacity:1}
.tnav{display:flex;padding:0 18px;background:var(--s1);border-bottom:1px solid var(--bd);gap:20px}
.tnav button{padding:12px 0 14px;background:none;border:none;border-bottom:2px solid transparent;color:var(--t3);font-size:13px;font-weight:700;cursor:pointer;transition:.2s;letter-spacing:.6px;margin-bottom:-1px;font-family:inherit}
.tnav button.active{color:var(--t1);border-bottom-color:var(--t1)}
.bnav{position:fixed;bottom:0;left:0;right:0;background:var(--s1);border-top:1px solid var(--bd);display:flex;z-index:100;padding-bottom:env(safe-area-inset-bottom,0px);max-width:680px;margin:0 auto}
.bnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;padding:14px 0 12px;background:none;border:none;cursor:pointer;color:#9C9A98;font-size:11px;font-weight:500;font-family:inherit;transition:.15s;letter-spacing:.2px;position:relative}
.bnav button.active{color:var(--t1);font-weight:700}
.bnav button svg{transition:color .15s;stroke-width:1.6}
.bnav button.active svg{stroke-width:2}
.bnav button.active::before{content:'';position:absolute;top:5px;left:50%;transform:translateX(-50%);width:5px;height:5px;border-radius:50%;background:#1A1A1A}
.page{padding:14px 16px 80px;max-width:680px;margin:0 auto}
.card{background:var(--s1);border-radius:16px;padding:18px;margin-bottom:10px;border:1px solid var(--bd);box-shadow:var(--shadow-sm)}
.lbl{font-size:13px;color:var(--t1);letter-spacing:-.01em;margin-bottom:14px;font-weight:700;display:flex;align-items:center;gap:6px}
.app input,.app select{background:var(--s2);border:1px solid var(--bd);border-radius:10px;padding:10px 14px;color:var(--t1);font-size:14px;outline:none;font-family:inherit;transition:.2s;width:100%}
.app input:focus,.app select:focus{background:var(--s1);border-color:var(--t2);box-shadow:none}
.app input::placeholder{color:var(--t3)}
.btn{background:var(--lav);border:none;border-radius:10px;padding:10px 18px;color:var(--s1);font-size:13px;font-weight:600;cursor:pointer;transition:.15s;white-space:nowrap;font-family:inherit}
.btn:hover{opacity:.85}
.btn-g{background:var(--s2);color:var(--t1);font-weight:500;border:1px solid var(--bd)}
.btn-g:hover,.btn-g.on{background:var(--lav);color:var(--s1);border-color:var(--lav)}
.btn-sm{font-size:12px;padding:7px 13px;border-radius:8px}
.btn-icon{background:none;border:none;cursor:pointer;padding:3px 5px;font-size:14px;line-height:1;color:var(--t2)}
.btn-icon:hover{color:var(--t1)}
.row{display:flex;gap:8px;align-items:center}
.empty{text-align:center;color:var(--t3);padding:28px;font-size:13px;line-height:1.8}
.sub-tabs{display:flex;gap:8px;margin:6px 0 18px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.sub-tabs::-webkit-scrollbar{display:none}
.sub-tab{padding:9px 22px;background:#FFFFFF;border:1px solid #E3E1DF;border-radius:999px;color:#8A8786;font-size:12px;cursor:pointer;text-align:center;transition:.2s;white-space:nowrap;font-weight:700;font-family:inherit;letter-spacing:.6px}
.sub-tab.on{background:#1A1A1A;color:#FFFFFF;border-color:#1A1A1A;box-shadow:none}
.add-row{display:flex;gap:8px;margin-bottom:10px}
.add-row input{flex:1}
.frow{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
.frow .btn-sm{border-radius:20px}
.pri-dot{width:14px;height:14px;border-radius:50%;display:inline-block;flex-shrink:0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.04)}
.pri-picker{position:relative}
.pri-trigger{display:inline-flex;align-items:center;gap:6px;padding:7px 11px;background:var(--lav-pale);border:none;border-radius:20px;cursor:pointer;font-size:12px;color:var(--lav);font-weight:500;font-family:inherit;transition:.15s}
.pri-trigger:hover,.pri-trigger.on{background:var(--lav);color:#fff}
.pri-trigger .caret{font-size:9px;opacity:.8}
.pri-menu{position:absolute;top:calc(100% + 6px);left:0;background:#fff;border-radius:14px;padding:8px;box-shadow:0 8px 24px rgba(0,0,0,.12);display:flex;flex-direction:column;gap:4px;z-index:20;min-width:110px}
.pri-menu .pri-opt{width:100%;height:32px;border-radius:10px;border:2px solid transparent;display:flex;align-items:center;gap:8px;cursor:pointer;transition:.15s;background:transparent;padding:0 8px;font-size:12px;font-family:inherit;color:var(--t1);font-weight:500}
.pri-menu .pri-opt:hover{background:var(--lav-xs)}
.pri-menu .pri-opt.sel{border-color:var(--lav)}
.ti{display:flex;align-items:center;gap:10px;padding:11px 14px;background:var(--s1);border-radius:12px;margin-bottom:6px;border:1px solid var(--bd);border-left:3px solid var(--bd)}
.ti.pr{border-left:3px solid var(--red)}
.ti.po{border-left:3px solid var(--ora)}
.ti.py{border-left:3px solid var(--ylw)}
.ti.pg{border-left:3px solid var(--grn)}
.ti.pb{border-left:3px solid var(--blu)}
.ti.pp{border-left:3px solid var(--pur)}
.ti.dn .tt{text-decoration:line-through;color:var(--t3)}
.ti-edit{display:flex;gap:6px;flex:1;align-items:center}
.ti-edit input{flex:1;padding:6px 10px;font-size:13px}
.chk{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--t3);flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:10px;transition:.15s}
.chk.on{background:var(--lav);border-color:var(--lav);color:var(--s1)}
.tt{flex:1;font-size:14px}
.prog-card{transition:background .6s ease,box-shadow .6s ease}
.prog-info{display:flex;justify-content:space-between;font-size:12px;color:var(--t2);margin-bottom:7px;font-weight:500}
.pbar{background:var(--s2);border-radius:6px;height:4px;overflow:hidden}
.pfill{height:100%;background:var(--lav);border-radius:6px;transition:.4s}
@keyframes pctBounce{0%{transform:scale(1)}40%{transform:scale(1.35)}70%{transform:scale(.92)}100%{transform:scale(1)}}
.pct-bounce{animation:pctBounce .4s ease forwards}
.pPct{font-weight:700;font-size:13px;transition:color .4s;display:inline-block}
.goals-box{background:var(--s2);border-radius:14px;padding:14px;margin-bottom:14px;border:1px solid var(--bd)}
.goals-box .lbl{color:var(--t1)}
.goal-item{display:flex;align-items:center;gap:9px;padding:9px 12px;background:var(--s1);border-radius:10px;margin-bottom:6px;border:1px solid var(--bd)}
.goal-txt{flex:1;font-size:13px}
.goal-chk{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--t3);flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:9px;transition:.15s}
.goal-chk.on{background:var(--lav);border-color:var(--lav);color:var(--s1)}
.goal-item.done .goal-txt{text-decoration:line-through;color:var(--t3)}
.goal-add{display:flex;gap:7px;margin-top:8px}
.goal-add input{flex:1;background:#fff}
.week-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.wnb{background:var(--lav-pale);border:none;color:var(--lav);border-radius:10px;padding:6px 13px;cursor:pointer;font-size:16px;font-weight:600}
.wnb:hover{background:var(--lav);color:#fff}
.week-title{font-family:'Space Mono',monospace;font-size:12px;color:var(--t2)}
.day-col{background:var(--s2);border-radius:16px;padding:12px;margin-bottom:8px}
.day-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}
.day-name{font-size:13px;font-weight:600}
.day-name.td{color:var(--t1);font-weight:700}
.day-date-lbl{font-size:11px;color:var(--t3)}
.day-ev{display:flex;align-items:center;gap:7px;padding:7px 10px;background:#fff;border-radius:10px;margin-bottom:4px;box-shadow:var(--shadow-sm)}
.day-ev .chk{width:16px;height:16px}
.day-ev-edit{display:flex;gap:5px;flex:1}
.day-ev-edit input{flex:1;padding:5px 9px;font-size:13px}
.ev-type-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.day-add-row{display:flex;gap:6px;margin-top:8px}
.day-add-row input{flex:1;font-size:13px;padding:8px 12px;background:#fff}
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.cnb{background:var(--s2);border:1px solid var(--bd);color:var(--t1);border-radius:8px;padding:5px 12px;cursor:pointer;font-size:16px;font-weight:600}
.cnb:hover{background:var(--lav);color:var(--s1);border-color:var(--lav)}
.cal-title{font-size:15px;font-weight:700}
.cal-grid{display:grid;grid-template-columns:22px repeat(7,1fr);border:1px solid var(--bd);border-radius:14px;overflow:hidden}
.ch{text-align:center;font-size:11px;color:var(--t2);padding:10px 0;font-weight:700;background:var(--s2);border-right:1px solid var(--bd);border-bottom:1px solid var(--bd)}
.ch:last-child{border-right:none}
.cd{min-height:58px;display:flex;flex-direction:column;justify-content:space-between;padding:6px 7px;font-size:13px;position:relative;transition:.15s;background:var(--s1);cursor:pointer;border-right:1px solid var(--bd);border-bottom:1px solid var(--bd)}
.cd:nth-child(8n){border-right:none}
.cd:hover{background:var(--lav-xs)}
.cd.other{background:var(--s2)}
.cd.sel{background:var(--s2)}
.cd-num{align-self:flex-end;font-size:13px;font-weight:500;color:var(--t1);width:22px;height:22px;display:flex;align-items:center;justify-content:center;border-radius:50%}
.cd.other .cd-num{color:var(--t3)}
.cd.sel .cd-num{color:var(--t1);font-weight:700}
.cd-num.today-num{background:var(--lav);color:var(--s1);font-weight:700}
.cd-dots{display:flex;gap:3px;align-self:flex-start;min-height:5px}
.edot{width:5px;height:5px;border-radius:50%}
.edot.timed{background:var(--lav)}
.edot.allday{background:var(--blu)}
.edot.habit{background:var(--ind)}.edot.gcal{background:#1a73e8}
.gcal-banner{background:var(--lav-xs);border-radius:14px;padding:12px 16px;margin-bottom:14px;display:flex;align-items:center;gap:10px}
.gcal-badge{font-size:9px;padding:1px 5px;border-radius:20px;background:#e8f0fe;color:#1a73e8;font-weight:700;flex-shrink:0}
.cd.p1{box-shadow:inset 0 0 0 3px #D0CDCA}
.cd.p2{box-shadow:inset 0 0 0 3px #B8B5B2}
.cd.p3{box-shadow:inset 0 0 0 3px #9A9795}
.cd.p4{box-shadow:inset 0 0 0 4px #6B6967}
.cd.p5{box-shadow:inset 0 0 0 4px #1A1A1A}
.ev-panel{margin-top:14px;border-top:1px solid var(--lav-pale);padding-top:14px}
.ev-hdr{font-size:13px;color:var(--t1);font-weight:600;margin-bottom:12px}
.ev-form{background:var(--s2);border-radius:14px;padding:14px;margin-bottom:12px}
.ev-form-row{display:flex;gap:7px;margin-bottom:8px;align-items:center}
.ev-form-row input{flex:1;background:#fff}
.allday-toggle{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--t2);cursor:pointer;margin-bottom:9px}
.allday-toggle input[type=checkbox]{width:16px;height:16px;accent-color:#1A1A1A;cursor:pointer;flex-shrink:0}
.allday-tag{font-size:10px;padding:3px 9px;border-radius:20px;background:var(--s2);color:var(--t1);font-weight:600;border:1px solid var(--bd)}
.ev-item{display:flex;align-items:center;gap:9px;padding:10px 13px;background:var(--s1);border-radius:12px;margin-bottom:6px;border:1px solid var(--bd)}
.ev-time{font-size:11px;color:var(--t2);min-width:38px;font-weight:500}
.ev-txt{flex:1;font-size:13px}
.ev-item.done-ev .ev-txt{text-decoration:line-through;color:var(--t3)}
.ev-inline-edit{display:flex;gap:6px;flex:1}
.ev-inline-edit input{flex:1;padding:5px 9px;font-size:13px;background:#fff}
.habit-section-lbl{font-size:10px;color:var(--t2);letter-spacing:1px;margin:12px 0 6px;font-weight:700}
.habit-ev-row{display:flex;align-items:center;gap:7px;padding:7px 11px;background:var(--s2);border-radius:10px;margin-bottom:5px;border:1px solid var(--bd)}
.habit-card{background:var(--s1);border-radius:16px;padding:16px;margin-bottom:10px;border:1px solid var(--bd);border-left:3px solid var(--bd)}
.habit-head{display:flex;align-items:center;gap:11px;margin-bottom:12px}
.habit-icon{font-size:20px;width:36px;height:36px;display:flex;align-items:center;justify-content:center;background:var(--s2);border-radius:10px;border:1px solid var(--bd)}
.habit-name{flex:1;font-size:15px;font-weight:600}
.habit-streak{font-size:14px;color:var(--t1);font-weight:700}
.habit-streak-lbl{font-size:10px;color:var(--t3)}
.habit-grid{display:flex;gap:5px;margin-bottom:10px}
.hg-day{display:flex;flex-direction:column;align-items:center;gap:4px;flex:1}
.hg-d{font-size:10px;color:var(--t3);font-weight:500}
.hg-dot{width:26px;height:26px;border-radius:8px;background:var(--s2);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:12px;transition:.15s;border:1px solid var(--bd)}
.hg-dot.done{background:var(--lav);color:var(--s1);border-color:var(--lav)}
.hg-dot.today-dot{box-shadow:0 0 0 2px var(--lav)}
.hg-dot.future{opacity:.25;cursor:default}
.day-pill{font-size:10px;padding:3px 9px;border-radius:20px;background:var(--s2);color:var(--t2);font-weight:600;border:1px solid var(--bd)}
.habit-days-row{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
.day-sel{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px}
.day-btn{min-width:36px;height:32px;padding:0 10px;border-radius:20px;background:var(--s2);border:1px solid var(--bd);color:var(--t2);font-size:12px;cursor:pointer;transition:.15s;font-weight:500;font-family:inherit}
.day-btn.on{background:var(--lav);color:var(--s1);border-color:var(--lav)}
.habit-edit-form{background:var(--s2);border-radius:14px;padding:14px;margin-bottom:10px}
.habit-edit-form input{margin-bottom:7px;background:#fff}
.habit-color-row{display:flex;gap:7px;margin-bottom:12px;flex-wrap:wrap}
.hb-col-btn{display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;padding:7px 10px;border-radius:14px;border:2px solid transparent;transition:.15s;background:none;font-family:inherit}
.hb-col-btn:hover{background:var(--lav-xs)}
.hb-col-btn.sel{border-color:var(--t1);background:var(--lav-xs)}
.hb-col-dot{width:30px;height:30px;border-radius:50%;box-shadow:0 2px 6px rgba(0,0,0,.1)}
.hb-col-label{font-size:10px;color:var(--t2);font-weight:700}
.color-picker{display:flex;gap:7px;margin-bottom:10px;flex-wrap:wrap}
.color-dot{width:22px;height:22px;border-radius:50%;cursor:pointer;transition:.15s;border:2px solid transparent}
.color-dot.sel{border-color:var(--t1);transform:scale(1.2)}
.cat-list{display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
.cat-card{background:var(--s1);border-radius:18px;overflow:hidden;box-shadow:var(--shadow)}
.cat-head{display:flex;align-items:center;gap:10px;padding:14px 16px;cursor:pointer;transition:.15s}
.cat-head:hover{background:var(--lav-xs)}
.cat-icon{font-size:20px;width:36px;height:36px;display:flex;align-items:center;justify-content:center;background:var(--lav-pale);border-radius:12px}
.cat-name-txt{flex:1;font-size:14px;font-weight:600}
.cat-summary{font-size:11px;color:var(--t3)}
.cat-arrow{color:var(--t3);font-size:14px;transition:.2s}
.cat-card.open .cat-arrow{transform:rotate(90deg)}
.cat-body{display:none;padding:0 16px 16px;border-top:1px solid var(--lav-xs)}
.cat-card.open .cat-body{display:block}
.step-list{margin:10px 0}
.step-item{display:flex;align-items:center;gap:9px;padding:9px 12px;background:var(--s2);border-radius:12px;margin-bottom:6px}
.step-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.step-nm{flex:1;font-size:13px}
.step-dur{font-family:'Space Mono',monospace;font-size:12px;color:var(--t1);min-width:46px;text-align:right;font-weight:700}
.step-edit-row{display:flex;gap:5px;flex:1;align-items:center;flex-wrap:wrap}
.step-edit-row input{padding:5px 9px;font-size:12px;background:#fff}
.add-step{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap;align-items:center}
.add-step input{flex:1;min-width:70px;background:#fff}
.dur-inp{width:62px!important;flex:none!important}
.edit-form{background:var(--s2);border-radius:14px;padding:13px;margin-bottom:10px}
.edit-form input{margin-bottom:7px;background:#fff}
.back-btn{display:flex;align-items:center;gap:6px;background:none;border:none;color:var(--t2);cursor:pointer;font-size:13px;margin-bottom:14px;padding:0;font-weight:500;font-family:inherit}
.back-btn:hover{color:var(--t1)}
.run-title{font-size:12px;color:var(--t3);margin-bottom:4px;font-weight:500}
.run-sname{font-size:20px;font-weight:600;margin-bottom:16px}
.ring-outer{display:flex;justify-content:center;position:relative;margin-bottom:16px}
.ring-outer svg{transform:rotate(-90deg)}
.ring-center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center}
.ring-time{font-family:'Space Mono',monospace;font-size:42px;font-weight:700;letter-spacing:-2px}
.ring-lbl{font-size:10px;color:var(--t3);margin-top:5px;letter-spacing:.8px;font-weight:600}
.pomo-btns{display:flex;justify-content:center;gap:10px;margin-bottom:12px}
.pomo-btns .btn{min-width:120px;font-size:14px;padding:13px 20px;border-radius:12px}
.rst-btn{background:var(--s2);color:var(--t1);border:1px solid var(--bd)}
.rst-btn:hover{background:var(--s2);opacity:.8}
.sp-progress{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;margin-bottom:16px}
.sp-dot{width:10px;height:10px;border-radius:50%;background:var(--bd);border:2px solid var(--bd);cursor:pointer;transition:.2s}
.sp-dot:hover{background:var(--t3);border-color:var(--t3);transform:scale(1.2)}
.sp-dot.d{background:var(--lav);border-color:var(--lav)}
.sp-dot.d:hover{opacity:.7}
.sp-dot.c{background:var(--lav);border-color:var(--lav);box-shadow:0 0 0 3px var(--s2);transform:scale(1.2)}
.stats-row{display:flex;justify-content:center;gap:12px}
.stat-box{text-align:center;background:var(--s1);border-radius:14px;padding:14px 20px;border:1px solid var(--bd);flex:1}
.stat-val{font-size:22px;color:var(--t1);font-weight:700}
.stat-lbl{font-size:11px;color:var(--t3);margin-top:4px}
.cal-view-3{display:flex;gap:6px;margin-bottom:14px;justify-content:center}
.cvs3-btn{padding:7px 16px;background:var(--s1);border:none;border-radius:20px;color:var(--t2);font-size:11px;cursor:pointer;font-family:'Space Mono',monospace;font-weight:700;letter-spacing:.5px;box-shadow:var(--shadow-sm);transition:.15s;white-space:nowrap}
.cvs3-btn.on{background:var(--lav);color:#fff;box-shadow:0 4px 12px rgba(0,0,0,.15)}
.ch-empty{background:var(--s2);border-right:1px solid var(--bd);border-bottom:1px solid var(--bd)}
.cw-label{display:flex;align-items:center;justify-content:center;background:var(--s2);border-right:1px solid var(--bd);border-bottom:1px solid var(--bd);font-size:8px;color:var(--t3);font-family:'Space Mono',monospace;writing-mode:vertical-rl;letter-spacing:1px;font-weight:700}
.cd-hol{font-size:7px;color:#e05050;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px}
.cd.is-hol .cd-num{color:#e05050!important}
.slot-row{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:7px}
.slot-btn{padding:4px 9px;border-radius:12px;border:none;cursor:pointer;font-size:11px;font-weight:600;font-family:inherit;transition:.15s;background:var(--s2);color:var(--t2)}
.slot-btn.on{background:#1A1A1A;color:#fff}
.slot-btn:hover{background:var(--lav-pale);color:var(--t1)}
.slot-btn.on:hover{background:#333333;color:#fff}
.proj-card{background:var(--s1);border-radius:16px;overflow:hidden;border:1px solid var(--bd);margin-bottom:10px;border-left:3px solid var(--bd)}
.proj-head{display:flex;align-items:center;gap:12px;padding:16px 18px;cursor:pointer;transition:.15s}
.proj-head:hover{background:var(--s2)}
.proj-icon{font-size:18px;width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:12px;flex-shrink:0;background:var(--s2);border:none}
.proj-info{flex:1;min-width:0}
.proj-name{font-size:15px;font-weight:700;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.2px}
.proj-meta{font-size:12px;color:var(--t2);font-weight:500}
.proj-dday-box{text-align:right;flex-shrink:0}
.proj-dday{font-size:16px;font-weight:800;letter-spacing:-.3px}
.proj-dday-lbl{font-size:10px;color:var(--t3);margin-top:2px;letter-spacing:.5px;font-weight:600}
.proj-arrow{color:var(--t3);font-size:14px;transition:.2s;flex-shrink:0;margin-left:2px}
.proj-card.open .proj-arrow{transform:rotate(90deg)}
.proj-body{display:none;padding:0 18px 18px;border-top:1px solid var(--bd)}
.proj-card.open .proj-body{display:block}
.proj-pbar-wrap{margin:14px 0 12px}
.proj-prog-info{display:flex;justify-content:space-between;font-size:11px;color:var(--t2);margin-bottom:6px;font-weight:500}
.proj-desc{font-size:13px;color:var(--t2);margin-bottom:12px;line-height:1.6;padding:10px 13px;background:var(--s2);border-radius:10px;border:1px solid var(--bd)}
.ptask{display:flex;align-items:center;gap:9px;padding:10px 13px;background:var(--s2);border-radius:10px;margin-bottom:6px;border:1px solid var(--bd)}
.ptask.done .ptask-txt{text-decoration:line-through;color:var(--t3)}
.ptask-txt{flex:1;font-size:13px}
.ptask-due{font-size:10px;color:var(--t3);font-family:'Space Mono',monospace;white-space:nowrap;padding:2px 7px;background:var(--s1);border-radius:8px}
.ptask-due.overdue{color:var(--red);font-weight:700;background:#fce8ea}
.ptask-memo-btn{background:none;border:none;cursor:pointer;padding:2px 6px;font-size:11px;color:var(--t3);border-radius:6px;transition:.15s}
.ptask-memo-btn:hover{color:var(--t1);background:var(--s2)}
.ptask-memo-btn.has-memo{color:var(--t2)}
.ptask-memo-area{padding:4px 12px 10px 44px}
.ptask-memo-area textarea{width:100%;background:var(--s2);border:1.5px solid transparent;border-radius:10px;padding:8px 11px;font-size:12px;font-family:inherit;color:var(--t1);resize:none;outline:none;transition:.2s;min-height:56px}
.ptask-memo-area textarea:focus{border-color:var(--t2);background:var(--s1)}
.proj-add-task{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;align-items:center}
.proj-add-task input{flex:1;min-width:100px;background:#fff}
.proj-date-inp{width:130px!important;flex:none!important;font-size:12px!important}
.proj-new-card{background:var(--s1);border-radius:20px;padding:18px;margin-bottom:12px;box-shadow:var(--shadow)}
.proj-new-card input{margin-bottom:8px}
.proj-color-row{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
.proj-col-dot{width:24px;height:24px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:.15s;flex-shrink:0}
.proj-col-dot.sel{border-color:var(--t1);transform:scale(1.2)}
.proj-memo-wrap{margin-top:14px;border-top:1px solid var(--lav-xs);padding-top:12px}
.proj-memo-lbl{font-size:11px;color:var(--t3);font-weight:700;margin-bottom:6px;letter-spacing:.5px}
.proj-memo{width:100%;min-height:80px;resize:vertical;background:var(--s2);border:1.5px solid transparent;border-radius:12px;padding:10px 12px;font-size:13px;font-family:inherit;color:var(--t1);outline:none;transition:border-color .2s;line-height:1.6;box-sizing:border-box}
.proj-memo:focus{border-color:var(--t2);background:#fff}
.proj-empty{text-align:center;padding:40px 20px;color:var(--t3);font-size:13px;line-height:2}
.memo-cat-card{background:var(--s1);border-radius:20px;overflow:hidden;box-shadow:var(--shadow);margin-bottom:12px}
.memo-cat-head{display:flex;align-items:center;gap:12px;padding:16px 18px;cursor:pointer;transition:.15s}
.memo-cat-head:hover{background:var(--lav-xs)}
.memo-cat-icon{font-size:22px;width:42px;height:42px;display:flex;align-items:center;justify-content:center;border-radius:14px;flex-shrink:0}
.memo-cat-name{flex:1;font-size:15px;font-weight:700}
.memo-cat-count{font-size:11px;color:var(--t2)}
.memo-cat-arrow{color:var(--t3);font-size:16px;transition:.2s;flex-shrink:0}
.memo-cat-card.open .memo-cat-arrow{transform:rotate(90deg)}
.memo-cat-body{display:none;padding:0 18px 16px;border-top:1px solid var(--lav-xs)}
.memo-cat-card.open .memo-cat-body{display:block}
.memo-card{background:var(--s2);border-radius:14px;padding:13px 15px;margin-bottom:8px;cursor:pointer;transition:.15s;border-left:4px solid transparent}
.memo-card:hover{background:var(--lav-xs)}
.memo-card.starred{border-left-color:#f5c842}
.memo-card-head{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.memo-card-title{flex:1;font-size:14px;font-weight:700;color:var(--t1)}
.memo-star-btn{background:none;border:none;cursor:pointer;font-size:16px;padding:2px 4px;transition:.15s}
.memo-card-preview{font-size:12px;color:var(--t2);line-height:1.5;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;margin-bottom:6px;white-space:pre-wrap}
.memo-tags{display:flex;gap:5px;flex-wrap:wrap}
.memo-tag{font-size:10px;padding:2px 8px;border-radius:20px;background:var(--s2);color:var(--t1);font-weight:600;border:1px solid var(--bd)}
.memo-detail{background:var(--s1);border-radius:16px;padding:18px;margin-bottom:10px;box-shadow:var(--shadow)}
.memo-detail-head{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.memo-detail-title{flex:1;font-size:16px;font-weight:700}
.memo-detail-body{font-size:13px;color:var(--t2);line-height:1.8;white-space:pre-wrap;margin-bottom:12px;min-height:80px}
.memo-edit-form{background:var(--s2);border-radius:14px;padding:14px;margin-bottom:10px}
.memo-edit-form input{margin-bottom:8px}
.memo-edit-form textarea{width:100%;background:var(--s1);border:1.5px solid transparent;border-radius:12px;padding:10px 12px;font-size:13px;font-family:inherit;color:var(--t1);resize:vertical;outline:none;min-height:100px;transition:.2s;line-height:1.7;box-sizing:border-box;margin-bottom:8px}
.memo-edit-form textarea:focus{border-color:var(--t2);background:#fff}
.memo-fav-section{background:var(--lav-xs);border-radius:16px;padding:14px;margin-bottom:14px}
.memo-fav-lbl{font-size:11px;font-weight:700;color:var(--t1);letter-spacing:1px;font-family:'Space Mono',monospace;margin-bottom:10px}
.memo-empty{text-align:center;padding:28px 20px;color:var(--t3);font-size:13px;line-height:2}
.memo-new-cat-form{background:var(--s1);border-radius:20px;padding:18px;margin-bottom:12px;box-shadow:var(--shadow)}
.memo-new-cat-form input{margin-bottom:8px}
.ti-memo-btn{background:none;border:none;cursor:pointer;padding:2px 5px;font-size:11px;color:var(--t3);transition:.15s;border-radius:6px}
.ti-memo-btn:hover{color:var(--t1);background:var(--s2)}
.ti-memo-btn.has-memo{color:var(--t2)}
.ti-memo-area{padding:6px 14px 10px 44px}
.ti-memo-area textarea{width:100%;background:var(--s2);border:1.5px solid transparent;border-radius:10px;padding:8px 11px;font-size:12px;font-family:inherit;color:var(--t1);resize:none;outline:none;transition:.2s;min-height:60px}
.ti-memo-area textarea:focus{border-color:var(--t2);background:var(--s1)}
.proj-task-row{display:flex;align-items:center;gap:9px;padding:9px 13px;background:var(--s2);border-radius:12px;margin-bottom:6px}
.proj-task-source{font-size:10px;color:var(--t3);white-space:nowrap;padding:2px 7px;border-radius:8px;background:var(--s1)}
.stat-section{margin-bottom:16px}
.stat-section-title{font-size:11px;font-weight:700;color:var(--t2);letter-spacing:1px;font-family:'Space Mono',monospace;margin-bottom:12px;text-transform:uppercase}
.big-numbers{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.big-num-box{background:var(--s1);border-radius:16px;padding:14px 10px;text-align:center;box-shadow:var(--shadow-sm)}
.big-num-val{font-family:'Space Mono',monospace;font-size:22px;font-weight:700;color:var(--t1);line-height:1}
.big-num-lbl{font-size:11px;color:var(--t3);margin-top:6px;line-height:1.5;font-family:'Nunito',sans-serif;font-weight:600}
.habit-stat-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.habit-stat-icon{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.habit-stat-info{flex:1;min-width:0}
.habit-stat-name{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:'Nunito',sans-serif;color:var(--t1)}
.habit-stat-bar-wrap{height:6px;background:var(--s2);border-radius:4px;margin-top:5px;overflow:hidden}
.habit-stat-bar{height:100%;border-radius:4px;transition:width .6s cubic-bezier(.4,0,.2,1)}
.habit-stat-pct{font-size:12px;font-weight:700;white-space:nowrap;flex-shrink:0;font-family:'Space Mono',monospace}
.proj-stat-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.proj-stat-color{width:4px;height:36px;border-radius:4px;flex-shrink:0}
.proj-stat-info{flex:1}
.proj-stat-name{font-size:13px;font-weight:700;font-family:'Nunito',sans-serif;color:var(--t1)}
.proj-stat-sub{font-size:11px;color:var(--t3);margin-top:2px;font-family:'Nunito',sans-serif}
.week-heatmap{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:4px}
.wh-day{text-align:center}
.wh-lbl{font-size:10px;color:var(--t3);margin-bottom:4px;font-family:'Nunito',sans-serif;font-weight:700}
.wh-bar-wrap{height:60px;display:flex;align-items:flex-end;justify-content:center}
.wh-bar{width:100%;border-radius:4px 4px 0 0;min-height:3px;transition:height .5s cubic-bezier(.4,0,.2,1)}
.wh-pct{font-size:9px;color:var(--t3);margin-top:4px;font-family:'Space Mono',monospace}
@keyframes tabIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.tab-anim{animation:tabIn .22s ease forwards}
@media(max-width:480px){
  .page{padding:10px 10px 70px}
  .card{padding:14px 13px;border-radius:16px}
  .hdr{padding:12px 12px 6px}
  .tnav{padding:8px 10px 0}
  .tnav button{font-size:10px;padding:10px 2px 8px}
  .sub-tab{padding:6px 12px;font-size:11px}
  .cal-grid{font-size:11px}
  .cd{min-height:44px;padding:4px 2px}
  .cd-num{font-size:11px}
  .cw-label{font-size:7px;width:16px}
  .ch{font-size:10px;padding:6px 2px}
  .ring-outer svg{width:180px;height:180px}
  .ring-time{font-size:36px}
  .proj-add-task{flex-direction:column}
  .proj-date-inp{width:100%!important}
  .habit-color-row{gap:4px}
  .hb-col-btn{padding:5px 6px}
  .hb-col-dot{width:24px;height:24px}
  .stats-row{gap:16px}
  .stat-box{padding:10px 14px}
  .day-sel{gap:3px}
  .day-btn{min-width:30px;padding:0 6px;font-size:11px}
  .add-row{flex-wrap:wrap}
  .frow{gap:4px}
  .login-badge span.name{display:none}
}
body.dark .goals-box{background:var(--lav-xs)}
body.dark .goal-item{background:var(--s2)}
body.dark .proj-new-card{background:var(--s2)}
body.dark .proj-memo{background:var(--s2);color:var(--t1)}
body.dark .proj-memo:focus{background:var(--s1);border-color:var(--lav-soft)}
body.dark .ptask{background:var(--s2)}
body.dark .hb-col-btn:hover{background:var(--lav-xs)}
body.dark .ev-panel{background:var(--s2)}
body.dark .ev-item{background:var(--s1)}
body.dark .pri-menu{background:var(--s2)}
/* === V2 Design System === */
.greeting{padding:18px 2px 14px;font-size:24px;font-weight:700;color:var(--t1);line-height:1.4;letter-spacing:-.5px}
.greeting .gsub{display:block;color:var(--t1)}
.stats3{background:var(--s1);border:1px solid var(--bd);border-radius:14px;padding:14px 8px;display:flex;align-items:stretch;margin-bottom:14px}
.stats3-col{flex:1;text-align:center;padding:0 6px;border-right:1px solid var(--bd);display:flex;flex-direction:column;justify-content:center}
.stats3-col:last-child{border-right:none}
.stats3-lbl{font-size:11px;color:var(--t2);font-weight:500;margin-bottom:4px}
.stats3-val{font-size:22px;font-weight:800;color:var(--t1);letter-spacing:-.5px;line-height:1.1}
.stats3-val .unit{font-size:13px;font-weight:600;color:var(--t1);margin-left:2px;letter-spacing:0}
.thin-pbar{height:3px;background:var(--bd);margin:0 0 22px;border-radius:2px;overflow:hidden}
.thin-pfill{height:100%;background:var(--lav);border-radius:2px;transition:width .4s}
.section-hdr{display:flex;align-items:center;justify-content:space-between;padding:0 2px;margin:18px 0 4px;font-size:13px;color:var(--t2);font-weight:500}
.section-hdr .action{color:var(--t1);font-weight:600;font-size:13px;cursor:pointer;border:none;background:none;font-family:inherit;padding:4px 0}
.section-hdr .count{color:var(--t2);font-weight:500;font-size:12px}
.todo-list{background:transparent;margin-top:4px}
.todo-row{display:flex;align-items:center;gap:11px;padding:13px 2px;border-bottom:1px solid var(--bd)}
.todo-row:last-child{border-bottom:none}
.todo-bar{width:2px;height:18px;border-radius:2px;background:var(--bd);flex-shrink:0}
.todo-row.done .tt{text-decoration:line-through;color:var(--t3)}
.todo-row.done .todo-bar{opacity:.4}
.todo-row .tt{flex:1;font-size:14px;color:var(--t1);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.todo-time{font-size:12px;color:var(--t3);font-weight:500;flex-shrink:0;font-variant-numeric:tabular-nums}
.todo-row .ti-actions{display:none;align-items:center;gap:2px}
.todo-row:hover .ti-actions{display:inline-flex}
.habit-v2{background:var(--s1);border:1px solid var(--bd);border-radius:14px;padding:14px;display:flex;align-items:center;gap:12px;margin-bottom:8px}
.habit-v2-icon{width:42px;height:42px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;color:#fff}
.habit-v2-mid{flex:1;min-width:0}
.habit-v2-name{font-size:14px;font-weight:600;margin-bottom:7px;color:var(--t1)}
.habit-week-dots{display:flex;gap:4px}
.habit-week-dot{flex:1;height:3px;border-radius:2px;background:var(--bd);max-width:32px}
.habit-week-dot.on{background:currentColor}
.habit-v2-right{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0}
.habit-days-num{font-size:18px;font-weight:700;line-height:1}
.habit-days-lbl{font-size:9px;color:var(--t3);letter-spacing:.8px;font-weight:600}
.habit-v2-chk{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--t3);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:11px;color:transparent;transition:.15s;background:transparent}
.habit-v2-chk.on{background:var(--lav);border-color:var(--lav);color:var(--s1)}
.page-eyebrow{font-size:11px;color:var(--t2);font-weight:600;letter-spacing:.8px;margin:18px 0 2px}
.page-title-row{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:14px;gap:12px}
.page-title{font-size:28px;font-weight:800;color:var(--t1);letter-spacing:-.8px;line-height:1.1}
.hero-btn{background:#1A1A1A;color:#FFFFFF;border:none;border-radius:999px;padding:11px 18px;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-family:inherit;white-space:nowrap;flex-shrink:0;line-height:1}
.hero-btn:hover{opacity:.85}
.dashed-add{display:flex;align-items:center;justify-content:center;gap:6px;padding:11px;background:transparent;border:1px dashed var(--bd);border-radius:10px;color:var(--t2);font-size:13px;font-weight:500;cursor:pointer;width:100%;margin-top:8px;font-family:inherit;transition:.15s}
.dashed-add:hover{border-color:var(--t2);color:var(--t1)}
.proj-card-v2{background:var(--s1);border:1px solid var(--bd);border-radius:14px;overflow:hidden;margin-bottom:10px;position:relative}
.proj-card-v2::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--bd)}
.proj-task-v2{display:flex;align-items:center;gap:11px;padding:10px 2px;border-bottom:1px solid var(--bd)}
.proj-task-v2:last-of-type{border-bottom:none}
.proj-task-v2 .ptt{flex:1;font-size:13px;color:var(--t1)}
.proj-task-v2.done .ptt{text-decoration:line-through;color:var(--t3)}
.date-pill{font-size:11px;padding:5px 12px;border-radius:999px;border:1px solid var(--bd);color:var(--t2);font-weight:500;font-variant-numeric:tabular-nums;background:#FFFFFF}
.date-pill.overdue{color:var(--red);border-color:var(--red)}
.bnav button{position:relative}
body.dark .greeting,body.dark .page-title,body.dark .stats3-val{color:var(--t1)}
/* === Monthly V2 (matches design) === */
.month-header-v2{display:flex;align-items:center;justify-content:space-between;margin:4px 0 14px;gap:12px}
.month-title-v2{font-size:26px;font-weight:800;color:#1A1A1A;letter-spacing:-.8px;line-height:1.1}
.month-title-v2 .yr{font-size:18px;font-weight:600;color:#1A1A1A;margin-left:6px}
.month-nav-v2{display:flex;gap:6px;align-items:center}
.month-nav-btn{width:36px;height:36px;border-radius:10px;border:1px solid #E3E1DF;background:#FFFFFF;color:#1A1A1A;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;font-family:inherit;font-weight:600;padding:0}
.month-nav-btn:hover{background:#F7F6F4}
.cal-grid-v2{display:grid;grid-template-columns:repeat(7,1fr);border-top:1px solid #EEECEA;border-left:1px solid #EEECEA;border-radius:0;overflow:hidden;margin-bottom:14px}
.ch-v2{text-align:center;font-size:12px;color:#888;padding:14px 0 12px;font-weight:500;background:#FFFFFF;border-right:1px solid #EEECEA;border-bottom:1px solid #EEECEA}
.cd-v2{min-height:72px;background:#FFFFFF;padding:10px 6px 6px;display:flex;flex-direction:column;align-items:center;border-right:1px solid #EEECEA;border-bottom:1px solid #EEECEA;cursor:pointer;transition:.15s}
.cd-v2:hover{background:#FAFAF8}
.cd-v2.sel{background:#F5F4F1}
.cd-v2.other{background:#FBFBF9}
.cd-v2.other .cd-v2-num{color:#D0CDCB}
.cd-v2-num{font-size:14px;font-weight:500;color:#1A1A1A;width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:50%}
.cd-v2-num.today{background:#1A1A1A;color:#FFFFFF;font-weight:700}
.cd-v2-dots{display:flex;gap:3px;margin-top:6px;min-height:6px;justify-content:center;flex-wrap:wrap;max-width:36px}
.cd-v2-dot{width:5px;height:5px;border-radius:50%}
.legend-row{display:flex;align-items:center;justify-content:space-between;margin:6px 2px 18px;font-size:11px;color:#9C9A98}
.legend-dots{display:flex;gap:8px}
.legend-dot{width:8px;height:8px;border-radius:50%}
.day-schedule-hdr{display:flex;align-items:center;justify-content:space-between;margin:8px 2px 12px;font-size:13px;color:var(--t2);font-weight:500}
.day-schedule-hdr .add{color:#1A1A1A;font-weight:600;cursor:pointer;border:none;background:none;font-family:inherit;font-size:13px}
.sch-row{display:flex;align-items:center;gap:11px;padding:13px 2px;border-bottom:1px solid var(--bd)}
.sch-row:last-child{border-bottom:none}
.sch-bar{width:2px;height:18px;border-radius:2px;flex-shrink:0;background:var(--bd)}
.sch-time{font-size:13px;color:var(--t2);font-weight:500;min-width:46px;font-variant-numeric:tabular-nums}
.sch-name{flex:1;font-size:14px;color:var(--t1)}
.sch-row.done .sch-name{text-decoration:line-through;color:var(--t3)}

/* === Stats V2 (matches design) === */
.stats-eyebrow{font-size:13px;color:var(--t2);font-weight:600;margin:8px 0 2px;letter-spacing:0}
.stats-title-v2{font-size:26px;font-weight:800;color:var(--t1);letter-spacing:-.6px;margin-bottom:18px;line-height:1.2}
.stats-big-card{background:var(--s1);border:1px solid var(--bd);border-radius:14px;padding:18px 6px;display:flex;margin-bottom:24px}
.stats-big-col{flex:1;text-align:center;padding:0 8px;border-right:1px solid var(--bd)}
.stats-big-col:last-child{border-right:none}
.stats-big-lbl{font-size:12px;color:var(--t2);margin-bottom:8px;font-weight:500}
.stats-big-val{font-size:30px;font-weight:800;color:var(--t1);letter-spacing:-1px;line-height:1}
.stats-big-val .u{font-size:14px;font-weight:600;color:var(--t1);margin-left:2px}
.stats-section-title{font-size:13px;color:var(--t2);font-weight:600;margin:18px 2px 12px}
.weekday-chart{background:var(--s1);border:1px solid var(--bd);border-radius:14px;padding:18px 12px 12px;display:flex;align-items:flex-end;gap:6px;height:170px;margin-bottom:8px}
.wc-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.wc-bar-wrap{width:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;flex:1;position:relative}
.wc-bar-bg{position:absolute;left:8%;right:8%;top:0;bottom:0;background:#F0EFED;border-radius:6px}
.wc-bar-fill{position:absolute;left:8%;right:8%;bottom:0;background:#1A1A1A;border-radius:6px}
.wc-day{font-size:12px;color:var(--t1);font-weight:600}
.wc-pct{font-size:11px;color:var(--t2);font-weight:500;font-variant-numeric:tabular-nums}
.habit-prog-row{padding:14px 2px;border-bottom:1px solid var(--bd)}
.habit-prog-row:last-child{border-bottom:none}
.habit-prog-top{display:flex;align-items:center;gap:9px;margin-bottom:7px}
.habit-prog-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.habit-prog-name{flex:1;font-size:14px;font-weight:700;color:var(--t1)}
.habit-prog-pct{font-size:14px;font-weight:700;color:var(--t1);font-variant-numeric:tabular-nums}
.habit-prog-bar{height:3px;background:#F0EFED;border-radius:2px;overflow:hidden;margin-left:17px}
.habit-prog-fill{height:100%;border-radius:2px;transition:width .5s}

/* === Memo V2 favorites === */
.fav-section-hdr{font-size:13px;color:var(--t2);font-weight:600;margin:8px 2px 10px;display:flex;align-items:center;gap:6px}
.fav-row{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;margin-bottom:18px;scrollbar-width:none}
.fav-row::-webkit-scrollbar{display:none}
.fav-card{flex:0 0 60%;min-width:200px;background:var(--s1);border:1px solid var(--bd);border-radius:12px;padding:14px;cursor:pointer;border-left-width:3px}
.fav-card-cat{font-size:11px;font-weight:600;margin-bottom:4px}
.fav-card-title{font-size:14px;font-weight:700;color:var(--t1);margin-bottom:6px;line-height:1.3}
.fav-card-body{font-size:12px;color:var(--t2);line-height:1.5;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.cat-section-hdr{display:flex;align-items:center;justify-content:space-between;margin:18px 2px 10px;font-size:13px;color:var(--t2);font-weight:500}
.cat-section-hdr .action{color:#1A1A1A;font-weight:600;cursor:pointer;border:none;background:none;font-family:inherit;font-size:13px;padding:0}
.memo-cat-v2{background:var(--s1);border:1px solid var(--bd);border-radius:14px;overflow:hidden;margin-bottom:10px}
.memo-cat-v2-head{display:flex;align-items:center;gap:12px;padding:14px;cursor:pointer}
.memo-cat-v2-icon{width:42px;height:42px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.memo-cat-v2-name{flex:1;font-size:15px;font-weight:700;color:var(--t1)}
.memo-cat-v2-count{font-size:12px;color:var(--t2);margin-top:2px;font-weight:500}
.memo-cat-v2-arrow{color:var(--t3);transition:.2s}
.memo-cat-v2.open .memo-cat-v2-arrow{transform:rotate(90deg)}
.memo-cat-v2-body{display:none;border-top:1px solid var(--bd)}
.memo-cat-v2.open .memo-cat-v2-body{display:block}
.memo-item-v2{padding:14px 16px;border-bottom:1px solid var(--bd);cursor:pointer;position:relative}
.memo-item-v2:last-child{border-bottom:none}
.memo-item-v2-head{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.memo-item-v2-title{flex:1;font-size:14px;font-weight:700;color:var(--t1)}
.memo-item-v2-date{font-size:11px;color:var(--t3);font-variant-numeric:tabular-nums}
.memo-item-v2-body{font-size:12px;color:var(--t2);line-height:1.5;margin-bottom:6px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical}
.memo-item-v2-tags{display:flex;gap:5px;flex-wrap:wrap}
.memo-item-v2-tag{font-size:11px;padding:3px 9px;border-radius:999px;background:#F5F4F1;color:var(--t2);font-weight:500;border:1px solid var(--bd)}
